name: Build

# Собирает Windows-exe и Android-APK. При пуше тега v* создаёт GitHub Release с обоими файлами.
env:
  PYTHONUTF8: "1"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Create icon
        run: python make_icon.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name YTDownloader
          --icon icon.ico --add-data "icon.ico;."
          --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp
          --hidden-import socks --copy-metadata yt-dlp main.py

      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-windows
          path: dist/YTDownloader.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key (если секрет задан)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-android
          path: android/app/build/outputs/apk/release/*.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name the APK
        run: mv dist/app-release*.apk dist/YTDownloader-android.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YTDownloader.exe
            dist/YTDownloader-android.apk
